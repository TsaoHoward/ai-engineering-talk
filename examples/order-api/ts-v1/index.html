<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synthetic Order API | Browser MSW Gate A</title>
    <style>
      body { margin: 2rem auto; padding: 0 2rem; max-width: 1000px; color: #192733; font: 16px/1.6 system-ui,sans-serif; }
      p { color: #52616e; } select,button { padding: .5rem 1rem; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f2f5f7; padding: 1rem; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>Synthetic Order API — browser MSW lab</h1>
    <p>No backend server or DB service. API → real TypeScript logic → ORM / SQL → MSW DB evaluator.</p>
    <p id="state" role="status">Starting browser worker...</p>
    <label for="query">Case:</label>
    <select id="query">
      <option value="?pageSize=3">Default page</option>
      <option value="?status=PAID&amp;fromDate=2026-01-01&amp;toDate=2026-01-01">Filtered UTC day</option>
      <option value="?page=-1">Bad page (HTTP 400)</option>
    </select>
    <button id="run">Run both variants</button>
    <pre id="output"></pre>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
