<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" font-family="Microsoft JhengHei" fill="#171717">
<title>RS3-02：共同 error envelope 與不同 message 語意</title>
<desc>同一個 Invalid query request 產生兩個 response。HTTP status、code 和 data 相同；message 分別是 raw error detail 和 message catalog key。code 不會自動推導 message。</desc>
<rect x="0" y="0" width="1600" height="1100" fill="#ffffff"/>
<text x="80" y="58" font-size="34" font-weight="700">共同 error envelope 保持不變；差異只在 message 語意</text>
<text x="80" y="91" font-size="19" fill="#555555">RS3-02｜兩個 Response 的共同基準與 message 語意差異</text>

<rect x="300" y="122" width="1000" height="116" fill="#f3f3f3" stroke="#333333" stroke-width="2"/>
<text x="330" y="153" font-size="18" fill="#555555">共同錯誤輸入</text>
<text x="330" y="202" font-size="27" font-weight="700">Invalid query request</text>

<line x1="800" y1="238" x2="800" y2="266" stroke="#555555" stroke-width="2"/>
<line x1="415" y1="266" x2="1185" y2="266" stroke="#555555" stroke-width="2"/>
<line x1="415" y1="266" x2="415" y2="289" stroke="#555555" stroke-width="2"/>
<polygon points="409,287 421,287 415,298" fill="#555555"/>
<line x1="1185" y1="266" x2="1185" y2="289" stroke="#555555" stroke-width="2"/>
<polygon points="1179,287 1191,287 1185,298" fill="#555555"/>

<rect x="70" y="300" width="690" height="600" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<rect x="72" y="302" width="686" height="64" fill="#e4e4e4"/>
<line x1="70" y1="368" x2="760" y2="368" stroke="#333333" stroke-width="2"/>
<text x="104" y="344" font-size="27" font-weight="700">AI-direct response</text>

<rect x="840" y="300" width="690" height="600" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<rect x="842" y="302" width="686" height="64" fill="#e4e4e4"/>
<line x1="840" y1="368" x2="1530" y2="368" stroke="#333333" stroke-width="2"/>
<text x="874" y="344" font-size="27" font-weight="700">Project-convention response</text>

<text x="98" y="397" font-size="17" font-weight="700" fill="#555555">共同 error envelope</text>
<text x="868" y="397" font-size="17" font-weight="700" fill="#555555">共同 error envelope</text>

<rect x="96" y="408" width="638" height="48" fill="#f6f6f6" stroke="#b0b0b0" stroke-width="1"/>
<text x="114" y="439" font-size="18">HTTP status</text>
<text x="716" y="440" font-size="24" font-weight="700" text-anchor="end">400</text>
<rect x="866" y="408" width="638" height="48" fill="#f6f6f6" stroke="#b0b0b0" stroke-width="1"/>
<text x="884" y="439" font-size="18">HTTP status</text>
<text x="1486" y="440" font-size="24" font-weight="700" text-anchor="end">400</text>
<text x="800" y="441" font-size="27" font-weight="700" fill="#555555" text-anchor="middle">=</text>

<rect x="96" y="466" width="638" height="48" fill="#f6f6f6" stroke="#b0b0b0" stroke-width="1"/>
<text x="114" y="497" font-size="18">code</text>
<text x="716" y="498" font-size="24" font-weight="700" text-anchor="end">INVALID_QUERY</text>
<rect x="866" y="466" width="638" height="48" fill="#f6f6f6" stroke="#b0b0b0" stroke-width="1"/>
<text x="884" y="497" font-size="18">code</text>
<text x="1486" y="498" font-size="24" font-weight="700" text-anchor="end">INVALID_QUERY</text>
<text x="800" y="499" font-size="27" font-weight="700" fill="#555555" text-anchor="middle">=</text>

<rect x="96" y="524" width="638" height="48" fill="#f6f6f6" stroke="#b0b0b0" stroke-width="1"/>
<text x="114" y="555" font-size="18">data</text>
<text x="716" y="556" font-size="24" font-weight="700" text-anchor="end">null</text>
<rect x="866" y="524" width="638" height="48" fill="#f6f6f6" stroke="#b0b0b0" stroke-width="1"/>
<text x="884" y="555" font-size="18">data</text>
<text x="1486" y="556" font-size="24" font-weight="700" text-anchor="end">null</text>
<text x="800" y="557" font-size="27" font-weight="700" fill="#555555" text-anchor="middle">=</text>

<rect x="96" y="594" width="638" height="174" fill="#ededed" stroke="#333333" stroke-width="2"/>
<text x="120" y="626" font-size="18" fill="#555555">message</text>
<text x="120" y="672" font-size="25" font-weight="700">fromDate and toDate must be</text>
<text x="120" y="710" font-size="25" font-weight="700">supplied together</text>
<rect x="96" y="790" width="260" height="48" fill="#d7d7d7" stroke="#777777" stroke-width="1"/>
<text x="226" y="821" font-size="19" font-weight="700" text-anchor="middle">raw error detail</text>

<rect x="866" y="594" width="638" height="174" fill="#ededed" stroke="#333333" stroke-width="2"/>
<text x="890" y="626" font-size="18" fill="#555555">message</text>
<text x="890" y="692" font-size="46" font-weight="700">m0001</text>
<rect x="866" y="790" width="310" height="48" fill="#d7d7d7" stroke="#777777" stroke-width="1"/>
<text x="1021" y="821" font-size="19" font-weight="700" text-anchor="middle">message catalog key</text>

<rect x="70" y="944" width="1460" height="112" fill="#f3f3f3" stroke="#777777" stroke-width="1.5"/>
<text x="100" y="981" font-size="18" font-weight="700" fill="#555555">欄位關係</text>
<text x="100" y="1023" font-size="22">code 與 message 是分別攜帶的欄位；INVALID_QUERY 不會自動推導或轉換 message。</text>
</svg>