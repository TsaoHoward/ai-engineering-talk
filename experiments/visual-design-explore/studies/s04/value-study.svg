<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="700" viewBox="0 0 2200 700" role="img" aria-labelledby="title desc">
  <title id="title">S04 Value Study — three grayscale allocations for the fixed Top-down Matrix</title>
  <desc id="desc">A study sheet with three 16 by 9 candidates using the same Top-down Matrix geometry and information set. V-A prioritizes the common conditions, V-B prioritizes the difference between the two message values, and V-C prioritizes the existing Consumer and Message Catalog contract. Only grayscale fills, text colors, and line contrast change.</desc>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L9 4.5L0 9Z" fill="#2b2b29"/>
    </marker>

    <style>
      .sans{font-family:"Noto Sans TC","Inter","Arial",sans-serif}
      .mono{font-family:"JetBrains Mono","SFMono-Regular","Consolas",monospace}
      .eyebrow{font-size:12px;letter-spacing:1.5px;font-weight:700}
      .label{font-size:12px;font-weight:700}
      .micro{font-size:10px}
      .micro-mono{font-size:10px}
      .value{font-size:11px}

      .matrix{--frame-fill:#fbfbf9;--frame-stroke:#2b2b29;--paper:#fbfbf9;--soft:#ededeb;--ink:#242422;--muted:#686863;--rule:#b8b8b2;--ink-rule:#2b2b29;--common-fill:#ededeb;--common-stroke:#b8b8b2;--common-text:#242422;--common-muted:#686863;--ai-fill:#f0f0ed;--ai-stroke:#74746e;--ai-text:#242422;--ai-muted:#686863;--project-fill:#fbfbf9;--project-stroke:#2b2b29;--project-text:#242422;--project-muted:#686863;--catalog-fill:#ededeb;--catalog-stroke:#b8b8b2;--catalog-text:#242422;--catalog-muted:#686863;--consumer-fill:#fbfbf9;--consumer-stroke:#2b2b29;--consumer-text:#242422;--consumer-muted:#686863;--miss-fill:#f0f0ed;--miss-stroke:#74746e;--miss-text:#242422;--hit-fill:#fbfbf9;--hit-stroke:#2b2b29;--hit-text:#242422}
      .matrix-frame{fill:var(--frame-fill);stroke:var(--frame-stroke);stroke-width:2}
      .matrix-paper{fill:var(--paper)}
      .matrix-soft{fill:var(--soft)}
      .matrix-ink{fill:var(--ink)}
      .matrix-muted{fill:var(--muted)}
      .matrix-rule{stroke:var(--rule);stroke-width:1.6}
      .matrix-ink-rule{stroke:var(--ink-rule);stroke-width:1.7}

      .common-panel{fill:var(--common-fill);stroke:var(--common-stroke)}
      .common-text{fill:var(--common-text)}
      .common-muted{fill:var(--common-muted)}
      .ai-panel{fill:var(--ai-fill);stroke:var(--ai-stroke)}
      .ai-text{fill:var(--ai-text)}
      .ai-muted{fill:var(--ai-muted)}
      .project-panel{fill:var(--project-fill);stroke:var(--project-stroke)}
      .project-text{fill:var(--project-text)}
      .project-muted{fill:var(--project-muted)}
      .catalog-panel{fill:var(--catalog-fill);stroke:var(--catalog-stroke)}
      .catalog-text{fill:var(--catalog-text)}
      .catalog-muted{fill:var(--catalog-muted)}
      .consumer-panel{fill:var(--consumer-fill);stroke:var(--consumer-stroke)}
      .consumer-text{fill:var(--consumer-text)}
      .consumer-muted{fill:var(--consumer-muted)}
      .miss-panel{fill:var(--miss-fill);stroke:var(--miss-stroke)}
      .miss-text{fill:var(--miss-text)}
      .hit-panel{fill:var(--hit-fill);stroke:var(--hit-stroke)}
      .hit-text{fill:var(--hit-text)}

      /* V-A: common conditions carry the strongest value. */
      .variant-a{--common-fill:#2b2b29;--common-stroke:#242422;--common-text:#fbfbf9;--common-muted:#d0d0ca;--catalog-fill:#d6d6d1;--catalog-stroke:#74746e;--consumer-fill:#f0f0ed;--consumer-stroke:#74746e}

      /* V-B: the two message-bearing response cards carry the strongest value. */
      .variant-b{--common-fill:#ededeb;--common-stroke:#b8b8b2;--common-text:#242422;--common-muted:#686863;--ai-fill:#686863;--ai-stroke:#2b2b29;--ai-text:#fbfbf9;--ai-muted:#e4e4df;--project-fill:#2b2b29;--project-stroke:#242422;--project-text:#fbfbf9;--project-muted:#d0d0ca;--catalog-fill:#f0f0ed;--consumer-fill:#fbfbf9}

      /* V-C: the existing Consumer and Message Catalog contract carry the strongest value. */
      .variant-c{--common-fill:#ededeb;--common-stroke:#b8b8b2;--common-text:#242422;--common-muted:#686863;--catalog-fill:#2b2b29;--catalog-stroke:#242422;--catalog-text:#fbfbf9;--catalog-muted:#d0d0ca;--consumer-fill:#d6d6d1;--consumer-stroke:#242422;--miss-fill:#c6c6c0;--miss-stroke:#686863;--hit-fill:#2b2b29;--hit-stroke:#242422;--hit-text:#fbfbf9}
    </style>

    <!-- One reusable B matrix. Each use keeps geometry and text fixed; the variant only changes grayscale variables. -->
    <g id="matrix-body">
      <rect width="660" height="371.25" rx="8" class="matrix-frame"/>
      <text x="20" y="27" class="sans matrix-ink" font-size="21" font-weight="700">B</text>
      <text x="55" y="26" class="sans matrix-muted eyebrow">TOP → DOWN MATRIX</text>
      <line x1="20" y1="39" x2="640" y2="39" class="matrix-rule"/>

      <!-- input -->
      <rect x="264" y="51" width="132" height="42" rx="8" class="matrix-paper matrix-ink-rule" stroke-width="1.7"/>
      <text x="330" y="69" text-anchor="middle" class="sans matrix-ink eyebrow">INPUT</text>
      <text x="330" y="84" text-anchor="middle" class="sans matrix-muted micro">invalid query</text>

      <!-- common band -->
      <rect x="28" y="108" width="604" height="61" rx="8" class="common-panel" stroke-width="1.5"/>
      <text x="43" y="128" class="sans common-text eyebrow">COMMON CONDITIONS · APPLIES TO BOTH RESPONSES</text>
      <text x="43" y="151" class="mono common-text value">HTTP 400</text>
      <text x="194" y="151" class="mono common-text value">INVALID_QUERY</text>
      <text x="405" y="151" class="mono common-muted value">data: null</text>
      <text x="560" y="151" class="sans common-muted micro">same envelope</text>

      <!-- response pair -->
      <rect x="28" y="191" width="286" height="64" rx="8" class="ai-panel" stroke-width="1.5" stroke-dasharray="6 5"/>
      <text x="43" y="211" class="sans ai-text label">AI-DIRECT RESPONSE</text>
      <text x="43" y="233" class="mono ai-text value">message: raw text</text>
      <text x="43" y="247" class="sans ai-muted micro">separate field</text>

      <rect x="346" y="191" width="286" height="64" rx="8" class="project-panel" stroke-width="1.7"/>
      <text x="361" y="211" class="sans project-text label">PROJECT-CONVENTION RESPONSE</text>
      <text x="361" y="233" class="mono project-text value">message: m0001</text>
      <text x="361" y="247" class="sans project-muted micro">separate field</text>

      <!-- catalog and consumer footer -->
      <rect x="28" y="279" width="170" height="63" rx="8" class="catalog-panel" stroke-width="1.5"/>
      <text x="42" y="299" class="sans catalog-muted eyebrow">MESSAGE CATALOG</text>
      <text x="42" y="320" class="mono catalog-text value">m0001 → display</text>
      <text x="42" y="334" class="sans catalog-muted micro">lookup source</text>

      <rect x="222" y="267" width="410" height="75" rx="8" class="consumer-panel" stroke-width="1.7"/>
      <text x="237" y="287" class="sans consumer-text eyebrow">EXISTING ERROR CONSUMER · MESSAGE → LOOKUP</text>
      <line x1="237" y1="296" x2="617" y2="296" class="matrix-rule"/>
      <text x="237" y="314" class="mono consumer-muted micro-mono">raw text → MISS · INCOMPATIBLE</text>
      <text x="237" y="332" class="mono consumer-text micro-mono">m0001 → HIT · COMPATIBLE · display</text>

      <!-- flow arrows -->
      <path d="M330 93V108" fill="none" class="matrix-ink-rule" marker-end="url(#arrow)"/>
      <path d="M330 169V177H171V191" fill="none" class="matrix-ink-rule" marker-end="url(#arrow)"/>
      <path d="M330 169V177H489V191" fill="none" class="matrix-ink-rule" marker-end="url(#arrow)"/>
      <path d="M171 255V262H390V267" fill="none" class="matrix-ink-rule" marker-end="url(#arrow)"/>
      <path d="M489 255V267" fill="none" class="matrix-ink-rule" marker-end="url(#arrow)"/>
      <path d="M198 311H222" fill="none" class="matrix-ink-rule" marker-end="url(#arrow)"/>
      <text x="20" y="360" class="sans matrix-muted micro">shared footer · two response lanes resolve through one consumer</text>
    </g>
  </defs>

  <rect width="2200" height="700" fill="#f7f7f4"/>

  <text x="60" y="40" class="sans" fill="#686863" font-size="12" letter-spacing="1.5px" font-weight="700">S04 · VALUE STUDY</text>
  <text x="2140" y="40" text-anchor="end" class="sans" fill="#686863" font-size="12" letter-spacing="1.5px" font-weight="700">D2.2 · B FIXED SPATIAL CONFIGURATION</text>
  <text x="60" y="80" class="sans" fill="#242422" font-size="29" font-weight="700">Three grayscale value allocations</text>
  <text x="60" y="108" class="sans" fill="#686863" font-size="16">same Top-down Matrix · same information set · only value and contrast change</text>

  <!-- Research labels sit outside each candidate frame. -->
  <text x="60" y="143" class="sans" fill="#242422" font-size="15" font-weight="700">V-A</text>
  <text x="105" y="143" class="sans" fill="#686863" font-size="12" letter-spacing="1.5px" font-weight="700">COMMON CONDITIONS PRIORITY</text>
  <text x="770" y="143" class="sans" fill="#242422" font-size="15" font-weight="700">V-B</text>
  <text x="815" y="143" class="sans" fill="#686863" font-size="12" letter-spacing="1.5px" font-weight="700">MESSAGE DIFFERENCE PRIORITY</text>
  <text x="1480" y="143" class="sans" fill="#242422" font-size="15" font-weight="700">V-C</text>
  <text x="1525" y="143" class="sans" fill="#686863" font-size="12" letter-spacing="1.5px" font-weight="700">CONSUMER · CATALOG CONTRACT PRIORITY</text>

  <use href="#matrix-body" x="60" y="165" class="matrix variant-a"/>
  <use href="#matrix-body" x="770" y="165" class="matrix variant-b"/>
  <use href="#matrix-body" x="1480" y="165" class="matrix variant-c"/>

  <text x="60" y="588" class="sans" fill="#686863" font-size="15">Fixed B geometry: input · common conditions · two message responses · message catalog · existing error consumer · miss/hit outcome.</text>
  <text x="60" y="615" class="sans" fill="#686863" font-size="15">Value study only: no movement, resizing, addition, deletion, or relationship changes.</text>
  <text x="60" y="650" class="sans" fill="#686863" font-size="13">Existing composition issues remain intentionally unchanged from D2.1 Massing B.</text>
</svg>
