<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">The same invalid query reaches two responses; message determines Consumer compatibility</title>
  <desc id="desc">The same invalid query reaches two independent response objects. Both contain HTTP status 400, code INVALID_QUERY, and data null. AI-direct sends raw message text and fails the existing Consumer's message catalog lookup. Project-convention sends m0001 and resolves to 查詢條件不合法.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#2b2b29"/>
    </marker>
    <style>
      .sans{font-family:"Noto Sans TC","Inter","Arial",sans-serif}
      .mono{font-family:"JetBrains Mono","SFMono-Regular","Consolas",monospace}
      .ink{fill:#242422}
      .muted{fill:#686863}
      .paper{fill:#fbfbf9}
      .rule{stroke:#b8b8b2;stroke-width:2}
      .ink-rule{stroke:#2b2b29;stroke-width:2}
      .eyebrow{font-size:15px;letter-spacing:2.2px;font-weight:700}
      .small{font-size:16px}
      .body{font-size:19px}
      .mono-body{font-size:18px}
      .label{font-size:17px;font-weight:700}
    </style>
  </defs>

  <rect width="1500" height="900" fill="#f7f7f4"/>

  <text x="70" y="72" class="sans ink" font-size="38" font-weight="700">同一個 invalid query，message 決定既有 Consumer 能否解析</text>
  <text x="70" y="106" class="sans muted body">兩個 response 的錯誤分類相同；差異只在 message 是否是既有 catalog 可識別的 key。</text>

  <!-- shared invalid request -->
  <g transform="translate(70 286)">
    <rect width="300" height="126" rx="14" class="paper" stroke="#2b2b29" stroke-width="2"/>
    <text x="24" y="31" class="sans ink eyebrow">SAME INVALID REQUEST</text>
    <text x="24" y="75" class="mono ink mono-body">?fromDate=2026-01-01</text>
    <text x="24" y="105" class="mono muted mono-body">toDate: missing</text>
  </g>

  <!-- one input branches to two distinct response objects -->
  <path d="M370 349H392V461H420" fill="none" class="ink-rule" marker-end="url(#arrow)"/>
  <path d="M392 349V603H420" fill="none" class="ink-rule" marker-end="url(#arrow)"/>
  <circle cx="392" cy="349" r="5" fill="#2b2b29"/>

  <!-- shared values and two separate message-bearing responses -->
  <text x="420" y="172" class="sans ink eyebrow">TWO RESPONSE OBJECTS</text>
  <rect x="420" y="194" width="520" height="154" rx="10" fill="#ededeb" stroke="#b8b8b2" stroke-width="2"/>
  <text x="446" y="221" class="sans ink eyebrow">COMMON VALUES · BOTH RESPONSES</text>
  <line x1="446" y1="240" x2="914" y2="240" class="rule"/>
  <text x="446" y="267" class="sans muted" font-size="14">TRANSPORT</text>
  <text x="590" y="267" class="mono ink" font-size="17">HTTP status: 400</text>
  <text x="446" y="294" class="sans muted" font-size="14">RESPONSE BODY</text>
  <text x="590" y="294" class="mono ink" font-size="17">code: INVALID_QUERY</text>
  <text x="590" y="317" class="mono ink" font-size="17">data: null</text>

  <!-- AI-direct response keeps its raw message -->
  <text x="420" y="424" class="sans ink label">AI-direct response</text>
  <rect x="420" y="438" width="520" height="86" rx="10" fill="#ededeb" stroke="#74746e" stroke-width="2"/>
  <text x="446" y="465" class="mono muted" font-size="15">message · raw text</text>
  <text x="446" y="492" class="mono ink" font-size="15">fromDate and toDate must be supplied together</text>

  <!-- Project-convention response keeps its catalog key -->
  <text x="420" y="566" class="sans ink label">Project-convention response</text>
  <rect x="420" y="580" width="520" height="86" rx="10" class="paper" stroke="#2b2b29" stroke-width="2"/>
  <text x="446" y="607" class="mono muted" font-size="15">message · catalog key</text>
  <text x="446" y="645" class="mono ink" font-size="31" font-weight="700">m0001</text>

  <!-- both message values enter the same Consumer -->
  <path d="M940 481C965 481 977 455 1000 455" fill="none" class="ink-rule" marker-end="url(#arrow)"/>
  <path d="M940 623C965 623 977 585 1000 585" fill="none" class="ink-rule" marker-end="url(#arrow)"/>

  <!-- shared Consumer and catalog -->
  <g transform="translate(1000 164)">
    <rect width="430" height="566" rx="16" class="paper" stroke="#2b2b29" stroke-width="2"/>
    <text x="28" y="34" class="sans ink eyebrow">EXISTING ERROR CONSUMER</text>
    <text x="28" y="62" class="sans muted small">message → MESSAGE_CATALOG</text>
    <line x1="28" y1="82" x2="402" y2="82" class="rule"/>

    <rect x="28" y="104" width="374" height="82" rx="10" fill="#ededeb" stroke="#b8b8b2" stroke-width="2"/>
    <text x="46" y="131" class="sans muted small">MESSAGE_CATALOG</text>
    <text x="46" y="163" class="mono ink" font-size="18">m0001  →  查詢條件不合法</text>

    <!-- failed lookup result -->
    <text x="28" y="235" class="sans ink label">AI-direct</text>
    <rect x="28" y="250" width="374" height="72" rx="10" fill="#f1f1ee" stroke="#74746e" stroke-width="2"/>
    <text x="46" y="278" class="sans ink" font-size="17" font-weight="700">incompatible · Unknown message code</text>
    <text x="46" y="304" class="mono muted" font-size="16">consumed: null</text>

    <!-- successful lookup result -->
    <text x="28" y="378" class="sans ink label">Project-convention</text>
    <rect x="28" y="393" width="374" height="72" rx="10" class="paper" stroke="#2b2b29" stroke-width="2"/>
    <text x="46" y="421" class="sans ink" font-size="17" font-weight="700">compatible · message code resolved</text>
    <text x="46" y="447" class="sans ink" font-size="16">displayMessage: 查詢條件不合法</text>
  </g>
</svg>
