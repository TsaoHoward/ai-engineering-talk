<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220" role="img" aria-labelledby="title desc">
  <title id="title">E5 factored common API baseline across two response comparison</title>
  <desc id="desc">One invalid query and one common API error envelope are shown once. The common baseline applies to two separate response cards, each retaining its own message value and meaning. Both messages continue into the shared Consumer lookup and catalog lanes from E4.</desc>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#333333" />
    </marker>
    <marker id="arrow-light" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#777777" />
    </marker>
    <style>
      text { font-family: "Noto Sans CJK TC", "Noto Sans TC", Arial, Helvetica, sans-serif; fill: #202020; }
      .eyebrow { font-size: 18px; font-weight: 700; letter-spacing: 2px; fill: #666666; }
      .title { font-size: 38px; font-weight: 700; letter-spacing: -0.4px; }
      .subtitle { font-size: 20px; fill: #5e5e5e; }
      .section { font-size: 24px; font-weight: 700; }
      .label { font-size: 16px; fill: #666666; }
      .small { font-size: 17px; }
      .body { font-size: 20px; }
      .body-bold { font-size: 20px; font-weight: 700; }
      .value { font-size: 23px; font-weight: 700; }
      .value-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 21px; }
      .value-large { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 31px; font-weight: 700; }
      .rule { font-size: 23px; font-weight: 700; }
      .note { font-size: 16px; fill: #5e5e5e; }
      .paper { fill: #f4f4f4; }
      .white { fill: #ffffff; }
      .light { fill: #e9e9e9; }
      .mid { fill: #d5d5d5; }
      .line { stroke: #333333; stroke-width: 3; fill: none; }
      .thin { stroke: #888888; stroke-width: 2; fill: none; }
      .dashed { stroke: #777777; stroke-width: 2.5; stroke-dasharray: 9 8; fill: none; }
      .frame { fill: #ffffff; stroke: #555555; stroke-width: 2.5; }
      .message { fill: #ffffff; stroke: #202020; stroke-width: 3.5; }
      .consumer { fill: #dedede; stroke: #333333; stroke-width: 3; }
      .catalog { fill: #ffffff; stroke: #333333; stroke-width: 3; }
      .lane { fill: #fafafa; stroke: #777777; stroke-width: 2; }
      .miss { fill: #eeeeee; stroke: #777777; stroke-width: 2; stroke-dasharray: 7 6; }
      .chip { fill: #d5d5d5; stroke: #777777; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1600" height="1220" class="paper" />

  <!-- Header -->
  <text x="70" y="48" class="eyebrow">S04 / RESPONSE COMPARISON</text>
  <text x="70" y="93" class="title">One API baseline, two message values</text>
  <text x="70" y="127" class="subtitle">The invalid case and shared error envelope stay fixed while each response keeps its own message.</text>
  <line x1="70" y1="151" x2="1530" y2="151" class="thin" />

  <!-- One invalid request: restored shared case baseline -->
  <rect x="70" y="180" width="1460" height="95" rx="10" class="frame" />
  <text x="100" y="214" class="section">Invalid query request</text>
  <text x="100" y="255" class="value-mono">?fromDate=2026-01-01</text>
  <text x="505" y="255" class="body">toDate is missing</text>
  <text x="1500" y="255" text-anchor="end" class="label">same invalid input</text>
  <path d="M 800 275 L 800 300" class="line" marker-end="url(#arrow)" />

  <!-- One factored common API baseline -->
  <rect x="70" y="300" width="1460" height="115" rx="10" class="consumer" />
  <text x="100" y="333" class="section">Common API error envelope · applies to both responses</text>
  <text x="1500" y="333" text-anchor="end" class="label">message remains response-specific</text>

  <rect x="100" y="350" width="410" height="48" rx="5" class="white" stroke="#aaaaaa" stroke-width="1.5" />
  <text x="124" y="371" class="label">HTTP status</text>
  <text x="124" y="393" class="value-mono">400</text>

  <rect x="595" y="350" width="410" height="48" rx="5" class="white" stroke="#aaaaaa" stroke-width="1.5" />
  <text x="619" y="371" class="label">code</text>
  <text x="619" y="393" class="value-mono">INVALID_QUERY</text>

  <rect x="1090" y="350" width="410" height="48" rx="5" class="white" stroke="#aaaaaa" stroke-width="1.5" />
  <text x="1114" y="371" class="label">data</text>
  <text x="1114" y="393" class="value-mono">null</text>

  <!-- Shared baseline branches to two response instances -->
  <path d="M 800 415 L 800 430 L 395 430 L 395 460" class="line" marker-end="url(#arrow)" />
  <path d="M 800 430 L 1205 430 L 1205 460" class="line" marker-end="url(#arrow)" />
  <text x="800" y="449" text-anchor="middle" class="label">same API baseline · two response instances</text>

  <!-- Response-specific message values: one owner per value -->
  <rect x="70" y="460" width="650" height="140" rx="10" class="message" />
  <rect x="880" y="460" width="650" height="140" rx="10" class="message" />

  <text x="100" y="493" class="section">AI-direct response</text>
  <text x="910" y="493" class="section">Project-convention response</text>
  <text x="100" y="520" class="label">message · raw error detail</text>
  <text x="910" y="520" class="label">message · message catalog key</text>
  <text x="100" y="552" class="value-mono">fromDate and toDate must be</text>
  <text x="100" y="579" class="value-mono">supplied together</text>
  <text x="910" y="563" class="value-large">m0001</text>

  <!-- Existing E4 Consumer and Catalog region retained -->
  <rect x="335" y="665" width="930" height="230" rx="12" class="consumer" />
  <text x="370" y="705" class="section">Existing error Consumer</text>
  <text x="370" y="733" class="label">one shared contract · same rule · inputs remain separate</text>
  <line x1="370" y1="751" x2="1230" y2="751" class="thin" />

  <rect x="370" y="775" width="360" height="54" rx="6" class="lane" />
  <rect x="870" y="775" width="360" height="54" rx="6" class="lane" />
  <text x="392" y="808" class="body-bold">lane A · supplied message</text>
  <text x="892" y="808" class="body-bold">lane B · supplied message</text>
  <path d="M 395 600 C 395 635, 490 690, 550 775" class="line" marker-end="url(#arrow)" />
  <path d="M 1205 600 C 1205 635, 1110 690, 1050 775" class="line" marker-end="url(#arrow)" />
  <text x="410" y="657" class="label">separate input A</text>
  <text x="1070" y="657" text-anchor="end" class="label">separate input B</text>

  <text x="800" y="863" text-anchor="middle" class="rule">same lookup rule: message → MESSAGE_CATALOG</text>
  <text x="800" y="884" text-anchor="middle" class="note">one supplied message value per evaluation · no merge</text>

  <!-- Separate lookup lanes into one shared catalog -->
  <path d="M 550 829 L 550 930 L 480 930 L 480 968" class="line" marker-end="url(#arrow)" />
  <path d="M 1050 829 L 1050 930 L 1120 930 L 1120 968" class="line" marker-end="url(#arrow)" />
  <text x="520" y="922" text-anchor="end" class="label">lookup lane A</text>
  <text x="1080" y="922" class="label">lookup lane B</text>

  <rect x="180" y="950" width="1240" height="215" rx="12" class="catalog" />
  <text x="215" y="989" class="section">MESSAGE_CATALOG · one shared catalog object</text>
  <text x="215" y="1017" class="label">The two lanes enter the same catalog independently; the raw value is not treated as an entry.</text>
  <line x1="800" y1="1035" x2="800" y2="1140" class="thin" />

  <!-- Catalog lane A: miss is an outcome, not an entry -->
  <rect x="215" y="1048" width="535" height="92" rx="7" class="lane" />
  <text x="240" y="1075" class="body-bold">lane A · raw-text key</text>
  <text x="240" y="1102" class="small">no matching catalog entry</text>
  <rect x="240" y="1113" width="225" height="24" rx="12" class="miss" />
  <text x="352" y="1130" text-anchor="middle" class="small">Unknown message code</text>

  <!-- Catalog lane B: entry is the supplied key object -->
  <rect x="850" y="1048" width="535" height="92" rx="7" class="lane" />
  <text x="875" y="1075" class="body-bold">lane B · catalog-key input</text>
  <text x="875" y="1102" class="small">existing entry reached by the supplied key</text>
  <text x="875" y="1129" class="value">→ 查詢條件不合法</text>

  <!-- Reference / reuse remains from E4 without redrawing m0001 -->
  <path d="M 1530 563 L 1560 563 L 1560 1035 L 1385 1035" class="dashed" marker-end="url(#arrow-light)" />
  <text x="1510" y="645" text-anchor="end" class="label">Reference / Reuse · same catalog-key object</text>

  <line x1="70" y1="1188" x2="1530" y2="1188" class="thin" />
  <text x="70" y="1210" class="note">The common API baseline is shown once; each response still owns a distinct message input and lookup lane.</text>
</svg>
