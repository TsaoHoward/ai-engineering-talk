<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Snapshot 06 — 沒有明確交代的，正是我依賴的既有規格</title>
  <desc id="desc">鏡頭拉遠，將交辦與既有規格放在同一個視野，回收 message、Consumer、責任與測試，並銜接下一章的規格與工作契約。</desc>
  <style>
    .sans{font-family:"Noto Sans TC","Inter","Arial",sans-serif}.mono{font-family:"JetBrains Mono","SFMono-Regular","Consolas",monospace}.ink{fill:#102438}.muted{fill:#667483}.blue{fill:#2F6B9A}.amber{fill:#A95D22}.green{fill:#2F8F66}.line{stroke:#CCD6DD;stroke-width:2}.small{font-size:16px}.body{font-size:20px}.label{font-size:17px;letter-spacing:2px}.card{fill:#FFFFFF;stroke:#CCD6DD;stroke-width:2}.brief{fill:#EEF4F7;stroke:#9DB4C1;stroke-width:2}.spec{fill:#EFF8F3;stroke:#7CB69B;stroke-width:2}.focus{fill:#FFFFFF;stroke:#2F6B9A;stroke-width:4}.chip{fill:#FFFFFF;stroke:#CCD6DD;stroke-width:2}
  </style>
  <rect width="1600" height="900" fill="#F7F8F6"/>
  <text x="88" y="48" class="sans muted label">DEVELOP / ORDER API · TRACE STORY</text>
  <text x="1512" y="48" text-anchor="end" class="sans muted label">06 / 06</text>
  <text x="88" y="114" class="sans ink" font-size="42" font-weight="700">沒有明確交代的，正是我依賴的既有規格</text>
  <text x="88" y="153" class="sans muted body">拉遠不是增加更多資訊，而是把前面檢查過的依賴放回同一個交付判斷。</text>

  <line x1="92" y1="230" x2="92" y2="730" class="line"/>
  <circle cx="92" cy="270" r="6" fill="#CCD6DD"/><circle cx="92" cy="420" r="6" fill="#CCD6DD"/><circle cx="92" cy="570" r="6" fill="#CCD6DD"/><circle cx="92" cy="720" r="9" fill="#2F6B9A"/>
  <text x="130" y="720" class="sans blue label">PULL BACK / DECIDE</text>

  <g transform="translate(135 235)">
    <rect width="560" height="430" rx="20" class="brief"/>
    <text x="32" y="48" class="sans blue label">交辦 / VISIBLE BRIEF</text>
    <text x="32" y="100" class="sans ink" font-size="27" font-weight="700">查詢訂單功能</text>
    <rect x="32" y="135" width="220" height="54" rx="12" class="chip"/><text x="142" y="169" text-anchor="middle" class="sans ink" font-size="20">狀態</text>
    <rect x="270" y="135" width="252" height="54" rx="12" class="chip"/><text x="396" y="169" text-anchor="middle" class="sans ink" font-size="20">UTC 日期區間</text>
    <rect x="32" y="205" width="220" height="54" rx="12" class="chip"/><text x="142" y="239" text-anchor="middle" class="sans ink" font-size="20">分頁</text>
    <rect x="270" y="205" width="252" height="54" rx="12" class="chip"/><text x="396" y="239" text-anchor="middle" class="sans ink" font-size="20">總筆數</text>
    <line x1="32" y1="298" x2="522" y2="298" stroke="#9DB4C1" stroke-width="2"/>
    <text x="32" y="345" class="sans muted body">描述了功能結果</text>
    <text x="32" y="385" class="sans muted body">沒有完整描述合作條件</text>
  </g>

  <g transform="translate(905 235)">
    <rect width="560" height="430" rx="20" class="spec"/>
    <text x="32" y="48" class="sans green label">既有規格 / INHERITED CONTRACT</text>
    <text x="32" y="100" class="sans ink" font-size="27" font-weight="700">驗收時真正依賴的東西</text>
    <rect x="32" y="135" width="222" height="72" rx="12" class="chip"/>
    <text x="50" y="163" class="mono green" font-size="20">m0000 / m0001</text><text x="50" y="190" class="sans muted small">message codes</text>
    <rect x="270" y="135" width="258" height="72" rx="12" class="chip"/>
    <text x="288" y="163" class="mono ink" font-size="18">data.items[]</text><text x="288" y="190" class="sans muted small">Consumer shape</text>
    <rect x="32" y="225" width="222" height="72" rx="12" class="chip"/>
    <text x="50" y="253" class="mono ink" font-size="18">Controller → Service</text><text x="50" y="280" class="sans muted small">責任與命名</text>
    <rect x="270" y="225" width="258" height="72" rx="12" class="chip"/>
    <text x="288" y="253" class="mono ink" font-size="18">UTC · sort · page</text><text x="288" y="280" class="sans muted small">測試規則</text>
    <line x1="32" y1="338" x2="528" y2="338" stroke="#7CB69B" stroke-width="2"/>
    <text x="32" y="382" class="sans green" font-size="22" font-weight="700">可交付？要看能否接上</text>
  </g>

  <g transform="translate(730 410)">
    <circle cx="70" cy="70" r="70" class="focus"/>
    <text x="70" y="63" text-anchor="middle" class="sans blue" font-size="19" font-weight="700">same</text>
    <text x="70" y="91" text-anchor="middle" class="sans blue" font-size="19" font-weight="700">case</text>
    <line x1="0" y1="70" x2="-35" y2="70" stroke="#2F6B9A" stroke-width="4"/>
    <line x1="140" y1="70" x2="175" y2="70" stroke="#2F6B9A" stroke-width="4"/>
  </g>

  <rect x="135" y="735" width="1330" height="78" rx="18" fill="#102438"/>
  <text x="800" y="783" text-anchor="middle" class="sans" font-size="29" font-weight="700" fill="#FFFFFF">沒有明確交代的，正是我依賴的既有規格。</text>
  <text x="88" y="855" class="sans muted small">transition → 下一章：規格 → 模組 → 工作契約</text>
  <text x="1512" y="855" text-anchor="end" class="sans muted small">recovered from snapshots 03–05 · evidence remains traceable</text>
</svg>
