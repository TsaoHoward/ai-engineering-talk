<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Snapshot 02 — 先看交辦：功能條件已經在場</title>
  <desc id="desc">同一個 Order API 查詢卡片固定在左側，右側以四個條件標籤呈現交辦內容，放大鏡仍只聚焦可見功能。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2F6B9A"/></marker></defs>
  <style>
    .sans{font-family:"Noto Sans TC","Inter","Arial",sans-serif}.mono{font-family:"JetBrains Mono","SFMono-Regular","Consolas",monospace}.ink{fill:#102438}.muted{fill:#667483}.blue{fill:#2F6B9A}.amber{fill:#A95D22}.green{fill:#2F8F66}.line{stroke:#CCD6DD;stroke-width:2}.trace{stroke:#2F6B9A;stroke-width:5;fill:none;stroke-linecap:round}.small{font-size:16px}.body{font-size:21px}.label{font-size:17px;letter-spacing:2px}.card{fill:#FFFFFF;stroke:#CCD6DD;stroke-width:2}.soft{fill:#EEF4F7}.tag{fill:#FFFFFF;stroke:#9DB4C1;stroke-width:2}.dash{fill:none;stroke:#A8BAC5;stroke-width:2;stroke-dasharray:8 9}
  </style>
  <rect width="1600" height="900" fill="#F7F8F6"/>
  <text x="88" y="48" class="sans muted label">DEVELOP / ORDER API · TRACE STORY</text>
  <text x="1512" y="48" text-anchor="end" class="sans muted label">02 / 06</text>
  <text x="88" y="114" class="sans ink" font-size="42" font-weight="700">先看交辦：功能條件已經在場</text>
  <text x="88" y="153" class="sans muted body">這一眼只回答「要做什麼」，不先替專案補完「怎麼接」。</text>

