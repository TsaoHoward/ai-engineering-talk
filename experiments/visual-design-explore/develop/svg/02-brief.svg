  <circle cx="92" cy="270" r="6" fill="#CCD6DD"/><circle cx="92" cy="420" r="9" fill="#2F6B9A"/><circle cx="92" cy="570" r="6" fill="#CCD6DD"/><circle cx="92" cy="720" r="6" fill="#CCD6DD"/>
