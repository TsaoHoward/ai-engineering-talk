  <text x="620" y="349" text-anchor="middle" class="sans blue" font-size="18" font-weight="700">fit</text>

  <g transform="translate(650 215)">
    <rect width="790" height="205" rx="18" class="ai"/>
    <text x="28" y="40" class="sans ink label">AI-DIRECT / SHORT PATH</text>
    <text x="28" y="100" class="mono ink" font-size="24">Controller → OrderRepository</text>
    <text x="28" y="138" class="mono ink" font-size="24">→ parameterized SQL</text>
