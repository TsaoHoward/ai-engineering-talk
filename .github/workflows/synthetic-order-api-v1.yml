name: Synthetic Order API — Browser SSOT

on:
  pull_request:
    paths:
      - 'examples/order-api/ts-v1/**'
      - '.github/workflows/synthetic-order-api-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    # Playwright 1.59 does not support the Ubuntu 26.04 image used by ubuntu-latest.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/order-api/ts-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install canonical browser example
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build browser API and MSW worker
        env:
          VITE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run build
      - name: Chromium API and DB MSW contract verification
        run: npm run test:e2e
      - name: Save source-identified browser execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-order-api-browser-evidence
          path: |
            examples/order-api/ts-v1/generated/browser-evidence.json
            examples/order-api/ts-v1/dist/mockServiceWorker.js
          if-no-files-found: ignore
