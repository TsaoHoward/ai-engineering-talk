name: Synthetic Order API v1

on:
  pull_request:
    paths:
      - 'examples/order-api/ts-v1/**'
      - '.github/workflows/synthetic-order-api-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/order-api/ts-v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated example dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck, HTTP tests, and evidence export
        run: npm run verify
      - name: Upload generated API evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-order-api-ts-v1-evidence
          path: examples/order-api/ts-v1/generated/*.json
          if-no-files-found: ignore

  browser:
    # Playwright 1.59 Chromium does not support ubuntu-26.04 (current ubuntu-latest).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/order-api/ts-v1/browser-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser lab dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build static MSW lab at a GitHub Pages subpath
        env:
          VITE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run build
      - name: Verify nested API and DB MSW handlers in real Chromium
        run: npm run test:e2e
      - name: Save browser test reproducibility inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-order-api-msw-browser-lab
          path: |
            examples/order-api/ts-v1/browser-lab/package-lock.json
            examples/order-api/ts-v1/browser-lab/dist/mockServiceWorker.js
            examples/order-api/ts-v1/browser-lab/generated/browser-evidence.json
          if-no-files-found: ignore
